services:
  redis:
    image: redis:7-alpine
    container_name: fpp-redis
    restart: unless-stopped
    # Internal service — only exposed for debugging access from host
    ports:
      - "${REDIS_PORT:-3003}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  postgres:
    image: postgres:16-alpine
    container_name: fpp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-file-processing-platform-db}
    # Internal service — only exposed for debugging access from host
    ports:
      - "${POSTGRES_PORT:-3002}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-file-processing-platform-db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app_network

  minio:
    image: minio/minio:latest
    container_name: fpp-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    # Internal service — only exposed for debugging access from host
    ports:
      - "${MINIO_PORT:-3004}:9000"
      - "${MINIO_CONSOLE_PORT:-3005}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app_network

  api:
    build:
      context: .
      dockerfile: infra/docker/dev.Dockerfile
    container_name: fpp-api
    working_dir: /app
    # Dev mode: tsx resolves imports via tsconfig path aliases (no build needed).
    # Run migrations manually: docker compose exec api pnpm --filter @fpp/db migrate
    command: pnpm --filter @fpp/api dev
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages/db:/app/packages/db
      - ./packages/types:/app/packages/types
      - ./.env:/app/.env
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-file-processing-platform-db}
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      CORS_ORIGIN: http://localhost:5173
    # Public-facing service
    ports:
      - "${API_PORT:-3001}:${API_CONTAINER_PORT:-3001}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app_network

  worker:
    build:
      context: .
      dockerfile: infra/docker/dev.Dockerfile
    container_name: fpp-worker
    working_dir: /app
    command: pnpm --filter @fpp/worker dev
    volumes:
      - ./apps/worker:/app/apps/worker
      - ./packages/db:/app/packages/db
      - ./packages/types:/app/packages/types
      - ./.env:/app/.env
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-file-processing-platform-db}
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app_network

  web:
    build:
      context: .
      dockerfile: infra/docker/dev.Dockerfile
    container_name: fpp-web
    working_dir: /app
    command: pnpm --filter @fpp/web dev
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages/types:/app/packages/types
      - ./.env:/app/.env
    env_file: .env
    environment:
      # Server-side variable — used by vite.config.ts to proxy requests to the
      # api container instead of localhost.
      API_PROXY_TARGET: http://api:${API_CONTAINER_PORT:-3001}
    # Public-facing service
    ports:
      - "${WEB_PORT:-3000}:${WEB_CONTAINER_PORT:-5173}"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - app_network

volumes:
  postgres_data:
  minio_data:

networks:
  app_network:
    driver: bridge
