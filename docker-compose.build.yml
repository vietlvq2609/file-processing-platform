# Production compose — builds compiled images and serves them behind nginx.
# Usage: docker compose -f docker-compose.build.yml up -d --build
#
# Before running:
#   1. Copy .env.example → .env and fill in all secrets.
#   2. Set CORS_ORIGIN to your public domain (e.g. https://example.com).

services:
  redis:
    image: redis:7-alpine
    container_name: fpp-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  postgres:
    image: postgres:16-alpine
    container_name: fpp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-file-processing-platform-db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-file-processing-platform-db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app_network

  minio:
    image: minio/minio:latest
    container_name: fpp-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app_network

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: fpp-api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-file-processing-platform-db}
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      # Set CORS_ORIGIN to your public domain. Behind nginx it can be omitted
      # since all traffic is same-origin, but it is kept for direct API access.
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - app_network

  worker:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    container_name: fpp-worker
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-file-processing-platform-db}
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
    depends_on:
      # Wait for the API to be healthy so migrations are guaranteed to have run.
      api:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - app_network

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    container_name: fpp-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app_network

volumes:
  postgres_data:
  minio_data:

networks:
  app_network:
    driver: bridge
