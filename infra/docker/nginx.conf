server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy all /api requests to the API service.
    # "api" resolves to the api container via Docker Compose's internal DNS.
    location /api/ {
        proxy_pass         http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Allow large file uploads to pass through nginx without being buffered
        # to disk (matches MAX_FILE_SIZE_BYTES default of 50 MB).
        client_max_body_size 55m;
        proxy_request_buffering off;
    }

    # Proxy WebSocket connections to the API service.
    location /ws {
        proxy_pass         http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_read_timeout 3600s;
    }

    # React Router — serve index.html for all non-asset paths so client-side
    # routing works correctly after a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Aggressive caching for hashed Vite assets (JS/CSS bundles).
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
